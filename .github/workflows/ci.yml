name: CI

on: pull_request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: run
        run: |
          # Attempt 1 fails with a flaky-looking network error when the branch
          # carries .flaky-marker; a `gh run rerun --failed` (attempt 2) passes.
          if [ "$GITHUB_RUN_ATTEMPT" = "1" ] && [ -f .flaky-marker ]; then
            echo "Error: connect ETIMEDOUT 10.0.0.1:443"
            exit 1
          fi
          echo ok
